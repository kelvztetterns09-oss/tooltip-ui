<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip UI</title>
    <meta name="description"
        content="A CSS-only tooltip UI that appears above navigation items on hover, using positioning and transitions.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="nav-item">
            <span class="tooltip">Go back to the homepage</span>
            Home
        </div>
        <div class="nav-item">
            <span class="tooltip">Here is everything I have built</span>
            Projects
        </div>
        <div class="nav-item">
            <span class="tooltip">Read my latest posts</span>
            Blog
        </div>
    </nav>

</body>

</html>
